<!doctype html>
<!--
  Plantilla de la imagen para compartir (assets/og-image.jpg, 1200×630) y de los íconos.
  Uso: abrir con el servidor local y capturar a 1200×630:
    http://localhost:5173/scripts/og.html          → imagen para compartir
    http://localhost:5173/scripts/og.html?icono=180 → ícono cuadrado
  Es genérica (sin nombre), así sigue siendo válida al cargar los datos reales.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>OG</title>
<link rel="stylesheet" href="../src/styles/tokens.css">
<style>
  html, body { margin: 0; background: #07040d; }
  .og {
    position: relative; width: 1200px; height: 630px; overflow: hidden; color: #fff;
    background:
      radial-gradient(60% 80% at 68% 30%, rgba(139, 61, 255, 0.55), transparent 70%),
      radial-gradient(50% 70% at 12% 90%, rgba(255, 45, 149, 0.45), transparent 70%),
      radial-gradient(40% 50% at 95% 95%, rgba(52, 18, 150, 0.7), transparent 70%),
      linear-gradient(160deg, #1a0a33, #07040d 70%);
  }
  .beam { position: absolute; top: -40px; width: 900px; height: 900px; margin-left: -450px; transform-origin: 50% 0;
    background: conic-gradient(from 172deg at 50% 0%, transparent 0deg, var(--c) 8deg, transparent 16deg);
    -webkit-mask-image: linear-gradient(180deg, #000, transparent 80%); mask-image: linear-gradient(180deg, #000, transparent 80%); }
  .ball { position: absolute; left: 610px; top: -10px; width: 560px; height: 560px; }
  .ball::before { content: ""; position: absolute; inset: -4%; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,45,149,.38), rgba(139,61,255,.25) 55%, transparent 76%); }
  .ball canvas { position: relative; width: 100%; height: 100%; }
  .chain { position: absolute; left: 889px; top: 0; width: 2px; height: 60px; background: #d9d4e6; }
  .type { position: absolute; left: 96px; top: 70px; width: 600px; }
  .xv { display: flex; align-items: baseline; gap: 14px; line-height: .8; }
  .mis { font: italic 500 92px/1 "Bodoni Moda", serif; color: #ff85c1; transform: translateY(-20px); }
  .fifteen { position: relative; font: 900 300px/.8 "Unbounded", sans-serif; letter-spacing: -0.05em;
    background: linear-gradient(180deg, rgba(255,255,255,.5), transparent 38%, transparent 62%, rgba(30,6,50,.55)), var(--mirror);
    background-size: 100% 100%, 1.25em 1.25em; -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 30px rgba(255, 45, 149, .55)); }
  .phrase { margin-top: 34px; font: italic 600 64px/1.02 "Bodoni Moda", serif;
    background: var(--chrome); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tag { display: inline-block; margin-top: 30px; padding: 12px 22px; border-radius: 999px; font: 600 19px/1 "Unbounded", sans-serif;
    letter-spacing: .16em; text-transform: uppercase; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.4); background: rgba(16,6,31,.5); }
  .dot { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, #fff, rgba(255,130,205,.5) 45%, transparent); }
  /* ícono */
  .icon { width: var(--s); height: var(--s); display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #3a1062, #0e061a 70%); }
  .icon canvas { width: 92%; height: 92%; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
  import { DiscoBall } from "../src/components/discoBall.js";
  import { initMirrorTexture } from "../src/components/mirrorTexture.js";
  initMirrorTexture();
  const size = new URLSearchParams(location.search).get("icono");
  const root = document.getElementById("root");
  if (size) {
    root.innerHTML = `<div class="icon" style="--s:${+size}px"><canvas></canvas></div>`;
    new DiscoBall(root.querySelector("canvas"), { rows: +size < 64 ? 12 : 22, speed: 0, tilt: -0.15, seed: 5, startAngle: 1.1, startTime: 5 });
  } else {
    const dots = Array.from({ length: 26 }, (_, i) => {
      const x = (i * 197) % 1200, y = (i * 131) % 630, w = 6 + (i * 7) % 16;
      return `<span class="dot" style="left:${x}px;top:${y}px;width:${w}px;height:${w * 0.62}px;opacity:${0.25 + (i % 5) * 0.12}"></span>`;
    }).join("");
    root.innerHTML = `
      <div class="og">
        <span class="beam" style="left:120px;--c:rgba(255,45,149,.35);transform:rotate(-18deg)"></span>
        <span class="beam" style="left:1080px;--c:rgba(139,61,255,.4);transform:rotate(22deg)"></span>
        ${dots}
        <span class="chain"></span>
        <div class="ball"><canvas></canvas></div>
        <div class="type">
          <div class="xv"><span class="mis">mis</span><span class="fifteen">15</span></div>
          <div class="phrase">Una noche<br>para brillar.</div>
          <div class="tag">Noche disco · Te espero</div>
        </div>
      </div>`;
    new DiscoBall(root.querySelector(".ball canvas"), { rows: 30, speed: 0, tilt: -0.2, seed: 7, startAngle: 0.9, startTime: 6 });
  }
  document.fonts.ready.then(() => document.body.dataset.ready = "1");
</script>
</body>
</html>
